<title>Cipher Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg:#0c1224; --panel:#141b32; --panel-2:#1b2440; --ink:#f2f4fb; --muted:#8b93b3;
    --border:#2a3459; --teal:#00c2d4; --gold:#e0a92b; --red:#e5534b; --green:#3ecf7e;
    --shadow: 0 20px 50px -20px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:'Manrope', system-ui, sans-serif;
    min-height:100%; padding:22px 16px calc(22px + env(safe-area-inset-bottom,0px));
    background-image: radial-gradient(circle at 12% 0%, rgba(0,194,212,.10), transparent 45%), radial-gradient(circle at 92% 100%, rgba(224,169,43,.08), transparent 50%);
  }
  .wrap{max-width:960px; margin:0 auto;}
  h1{font-family:'Archivo Black', 'Manrope', sans-serif; letter-spacing:.01em; margin:0;}
  header{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:20px;}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand .mark{
    width:46px; height:46px; border-radius:12px; background:linear-gradient(135deg, var(--gold), #8a5a05);
    display:flex; align-items:center; justify-content:center; font-size:22px; box-shadow:var(--shadow); flex-shrink:0;
  }
  .brand h1{font-size:20px; color:var(--ink);}
  .brand p{margin:2px 0 0; font-size:11.5px; color:var(--muted); font-family:'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:.1em;}
  .round-pill{
    font-family:'JetBrains Mono',monospace; background:var(--panel); border:1px solid var(--border); border-radius:999px;
    padding:8px 16px; font-size:13px; font-weight:600; box-shadow:var(--shadow); display:flex; align-items:center; gap:10px;
  }
  .round-pill span{color:var(--gold);}
  .round-pill .who{color:var(--teal); max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .stage{background:var(--panel); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); overflow:hidden;}
  .shead{padding:16px 24px; border-bottom:1px solid var(--border); background:var(--panel-2); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;}
  .shead .tag{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--teal); letter-spacing:.08em; text-transform:uppercase;}
  .sbody{padding:30px 28px;}

  /* Name gate */
  .gate{max-width:460px; margin:60px auto; text-align:center;}
  .gate p.lead{color:var(--muted); font-size:15px; margin:10px 0 26px;}
  .name-input{
    width:100%; font-family:'Manrope',sans-serif; font-size:17px; font-weight:600; padding:14px 16px;
    border-radius:10px; border:1.5px solid var(--border); background:var(--panel-2); color:var(--ink); margin-bottom:16px;
  }
  .name-input:focus{outline:none; border-color:var(--teal);}
  .name-input::placeholder{color:var(--muted); font-weight:400;}

  .cipher-display{
    font-family:'JetBrains Mono',monospace; font-size:clamp(22px, 4vw, 34px); font-weight:700; letter-spacing:.07em;
    text-align:center; padding:24px 18px; border-radius:14px; background:var(--panel-2); border:1px solid var(--border);
    margin-bottom:22px; word-break:break-all; color:var(--gold);
  }

  .answer-input{
    width:100%; font-family:'JetBrains Mono',monospace; font-size:clamp(18px, 3vw, 24px); font-weight:700; letter-spacing:.06em;
    text-align:center; padding:18px 16px; border-radius:12px; border:2px solid var(--border); background:var(--panel-2);
    color:var(--ink); text-transform:uppercase; margin-bottom:16px;
  }
  .answer-input:focus{outline:none; border-color:var(--teal);}
  .answer-input.correct{border-color:var(--green); background:rgba(62,207,126,.1); color:var(--green);}
  .answer-input.wrong{border-color:var(--red); background:rgba(229,83,75,.1); color:var(--red);}
  .answer-input::placeholder{color:var(--muted); text-transform:none; font-weight:400; font-size:15px;}

  .controls{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-bottom:6px;}
  .btn{font-family:'Manrope',sans-serif; font-weight:700; font-size:15px; padding:13px 22px; border-radius:10px; border:none; cursor:pointer; transition:transform .1s, filter .15s;}
  .btn:hover{filter:brightness(1.1); transform:translateY(-1px);}
  .btn.primary{background:var(--teal); color:#03222a;}
  .btn.gold{background:var(--gold); color:#241a02;}
  .btn.ghost{background:transparent; color:var(--muted); border:1.5px solid var(--border);}
  .btn:disabled{opacity:.4; cursor:default; transform:none;}

  .hint-box{margin-top:18px; padding:14px 16px; border-radius:10px; background:rgba(224,169,43,.08); border:1px solid rgba(224,169,43,.35); font-size:13.5px; color:#f3e2ba; display:none;}
  .hint-box.show{display:block;}

  .attempts-note{text-align:center; font-size:12.5px; color:var(--muted); margin:-6px 0 18px; font-family:'JetBrains Mono',monospace;}

  .feedback-line{text-align:center; font-size:14.5px; font-weight:700; margin-bottom:14px; min-height:20px;}
  .feedback-line.correct{color:var(--green);}
  .feedback-line.wrong{color:var(--red);}

  .final{background:var(--panel); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); padding:44px 30px; text-align:center;}
  .final .eyebrow{font-family:'JetBrains Mono',monospace; color:var(--gold); text-transform:uppercase; letter-spacing:.12em; font-size:12.5px;}
  .final h2{font-family:'Archivo Black','Manrope',sans-serif; font-size:clamp(22px,3.6vw,28px); margin:12px 0 6px;}
  .final .student{color:var(--teal); font-family:'JetBrains Mono',monospace; font-size:15px; margin-bottom:22px;}
  .score-ring{
    width:150px; height:150px; border-radius:50%; margin:0 auto 20px; display:flex; align-items:center; justify-content:center;
    background:var(--panel-2); border:6px solid var(--teal); flex-direction:column;
  }
  .score-ring .num{font-family:'Archivo Black','Manrope',sans-serif; font-size:38px; color:var(--ink);}
  .score-ring .out{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em;}
  .final p.sub{color:var(--muted); font-size:14.5px; max-width:520px; margin:0 auto 24px;}
  .replay{margin-top:6px;}
  [hidden]{display:none!important;}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark">🔐</div>
      <div>
        <h1>Cipher Challenge</h1>
        <p>ICD2O · Data Encryption Principles</p>
      </div>
    </div>
    <div class="round-pill" id="topPill" hidden>
      <span class="who" id="whoLabel"></span> · Round <span id="roundVal">1</span> of <span id="roundTotal">5</span> · Score <span id="scoreVal">0</span>
    </div>
  </header>

  <div id="gateHolder"></div>
  <div id="stageHolder"></div>

  <div class="final" id="finalView" hidden>
    <p class="eyebrow">Challenge Complete</p>
    <h2>Nice work cracking the ciphers.</h2>
    <p class="student" id="finalName"></p>
    <div class="score-ring"><div class="num" id="finalScoreNum">0</div><div class="out" id="finalScoreOut">/ 5</div></div>
    <p class="sub">A shift cipher only has 25 possible keys — trivial to brute-force. That's exactly why real encryption uses keys with trillions of possibilities instead.</p>
    <button class="btn gold replay" onclick="restart()">Play Again</button>
  </div>
</div>

<script>
(function(){
  var ROUNDS = [
    { plain:'STAY SAFE ONLINE', shift:3 },
    { plain:'CHECK THE PADLOCK', shift:5 },
    { plain:'USE A STRONG KEY', shift:7 },
    { plain:'ENCRYPT YOUR DATA', shift:4 },
    { plain:'TRUST BUT VERIFY', shift:9 },
  ];

  var state = { name:'', round:0, score:0, answered:false, lastCorrect:null, started:false, attempts:0 };
  var gateHolder = document.getElementById('gateHolder');
  var holder = document.getElementById('stageHolder');
  var finalView = document.getElementById('finalView');
  var topPill = document.getElementById('topPill');
  var whoLabel = document.getElementById('whoLabel');
  var roundVal = document.getElementById('roundVal');
  var roundTotal = document.getElementById('roundTotal');
  var scoreVal = document.getElementById('scoreVal');
  roundTotal.textContent = ROUNDS.length;

  function encode(text, shift) {
    return text.split('').map(function(ch){
      var code = ch.charCodeAt(0);
      if (code >= 65 && code <= 90) {
        return String.fromCharCode(((code - 65 + shift) % 26 + 26) % 26 + 65);
      }
      return ch;
    }).join('');
  }
  function normalize(s){ return s.toUpperCase().replace(/[^A-Z ]/g, '').replace(/\s+/g, ' ').trim(); }

  function renderGate(){
    var html = '<div class="gate">';
    html += '<h1 style="font-size:22px;">Enter your name to start</h1>';
    html += '<p class="lead">Your name and score are shown at the end so you can show your teacher. The shift key is NOT given this time — you\'ll have to work it out yourself.</p>';
    html += '<input class="name-input" id="nameField" type="text" placeholder="Your full name" maxlength="60" value="' + (state.name || '') + '">';
    html += '<button class="btn gold" onclick="startChallenge()">Start Challenge →</button>';
    html += '</div>';
    gateHolder.innerHTML = html;
    document.getElementById('nameField').addEventListener('keydown', function(e){ if (e.key === 'Enter') startChallenge(); });
  }

  window.startChallenge = function(){
    var v = document.getElementById('nameField').value.trim();
    if (!v) { document.getElementById('nameField').focus(); return; }
    state.name = v;
    state.started = true;
    gateHolder.innerHTML = '';
    gateHolder.hidden = true;
    topPill.hidden = false;
    whoLabel.textContent = state.name;
    renderStage();
    try{ save(); }catch(e){}
  };

  function renderStage(){
    var item = ROUNDS[state.round];
    var cipher = encode(item.plain, item.shift);

    var html = '<div class="stage"><div class="shead"><span class="tag">Encrypted Message ' + (state.round + 1) + '</span>';
    html += '<span class="tag" style="color:var(--muted);">Shift key: ??? — figure it out</span></div>';
    html += '<div class="sbody">';
    html += '<div class="cipher-display">' + cipher + '</div>';

    html += '<div class="feedback-line' + (state.answered ? (state.lastCorrect ? ' correct' : ' wrong') : '') + '">' +
      (state.answered ? (state.lastCorrect ? '✓ Correct! Well decoded.' : '✗ Not quite — check the answer below.') : '') + '</div>';

    html += '<input class="answer-input' + (state.answered ? (state.lastCorrect ? ' correct' : ' wrong') : '') + '" id="answerField" type="text" placeholder="Type the decoded message..." ' + (state.answered ? 'disabled' : '') + ' value="' + (state.currentInput || '') + '">';

    if (!state.answered) {
      html += '<div class="attempts-note">No shift key is given — this one is on you.</div>';
    }

    if (state.answered && !state.lastCorrect) {
      html += '<div class="feedback-line" style="color:var(--muted); font-weight:600;">Correct answer: ' + item.plain + '</div>';
    }

    html += '<div class="controls">';
    if (!state.answered) {
      html += '<button class="btn ghost" onclick="toggleHint()">Show Hint</button>';
      html += '<button class="btn gold" onclick="checkAnswer()">Check Answer</button>';
    } else {
      html += '<button class="btn primary" onclick="nextRound()">' + (state.round < ROUNDS.length - 1 ? 'Next Message →' : 'Finish →') + '</button>';
    }
    html += '</div>';

    html += '<div class="hint-box" id="hintBox">A Caesar cipher only has 25 possible shifts, so every message here can be cracked by systematically testing each one. Two other tricks: the most common letter in a longer scrambled message is often really E, T, or A — and a single-letter "word" in English is almost always A or I.</div>';

    html += '</div></div>';
    holder.innerHTML = html;

    var field = document.getElementById('answerField');
    if (field && !state.answered) {
      field.focus();
      field.addEventListener('input', function(e){ state.currentInput = e.target.value; });
      field.addEventListener('keydown', function(e){ if (e.key === 'Enter') checkAnswer(); });
    }
  }

  window.toggleHint = function(){
    var hb = document.getElementById('hintBox');
    if (hb) hb.classList.toggle('show');
  };

  window.checkAnswer = function(){
    var item = ROUNDS[state.round];
    var field = document.getElementById('answerField');
    var val = field ? field.value : '';
    var correct = normalize(val) === normalize(item.plain);
    state.answered = true;
    state.lastCorrect = correct;
    state.currentInput = val;
    if (correct) state.score++;
    renderStage();
    scoreVal.textContent = state.score;
    try{ save(); }catch(e){}
  };

  window.nextRound = function(){
    if (state.round < ROUNDS.length - 1) {
      state.round++; state.answered = false; state.lastCorrect = null; state.currentInput = '';
      roundVal.textContent = state.round + 1;
      renderStage();
    } else {
      showFinal();
    }
    try{ save(); }catch(e){}
  };

  function showFinal(){
    holder.hidden = true;
    topPill.hidden = true;
    finalView.hidden = false;
    document.getElementById('finalName').textContent = state.name;
    document.getElementById('finalScoreNum').textContent = state.score;
    document.getElementById('finalScoreOut').textContent = '/ ' + ROUNDS.length;
  }

  window.restart = function(){
    state = { name:'', round:0, score:0, answered:false, lastCorrect:null, started:false, currentInput:'' };
    gateHolder.hidden = false;
    holder.hidden = false;
    finalView.hidden = true;
    topPill.hidden = true;
    renderGate();
    try{ save(); }catch(e){}
  };

  function save(){ localStorage.setItem('cipherChallengeState', JSON.stringify(state)); }
  function load(){
    try{
      var raw = localStorage.getItem('cipherChallengeState');
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && typeof parsed.round === 'number' && parsed.round >= 0 && parsed.round < ROUNDS.length) state = parsed;
      }
    }catch(e){}
  }

  function boot(data){
    if (data && data.state) state = data.state;
    else load();
    roundVal.textContent = state.round + 1;
    scoreVal.textContent = state.score || 0;
    if (state.started && state.name) {
      gateHolder.hidden = true;
      topPill.hidden = false;
      whoLabel.textContent = state.name;
      if (state.round >= ROUNDS.length) { showFinal(); }
      else { renderStage(); }
    } else {
      renderGate();
    }
  }

  if (window.claude && window.claude.hot) {
    window.claude.hot.snapshot(function(){ return { state: state }; });
    window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data);
  } else {
    boot();
  }
})();
</script>
